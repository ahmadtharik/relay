services:
 db:
  image: postgres:16-alpine
  restart: unless-stopped
  user: postgres
  secrets:
    - db-password
  volumes:
    - db-data:/var/lib/postgresql/data
  environment:
    - POSTGRES_DB=relay
    - POSTGRES_PASSWORD_FILE=/run/secrets/db-password
  ports:
    - 5432

 redis:
  image: redis:7.4-alpine
  restart: unless-stopped
  ports:
    - 6379
  
volumes:
 db-data:


secrets:
  db-password:
    file: db/password.txt